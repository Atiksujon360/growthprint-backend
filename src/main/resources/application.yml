
spring:
  application:
    name: growthprint-backend

  datasource:
    url: "${DATABASE_URL:}"
    username: "${DATABASE_USERNAME:}"
    password: "${DATABASE_PASSWORD:}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  openapi:
    info:
      title: GrowthPrint Backend API
      description: REST API for the GrowthPrint platform
      version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: 8080

app:
  admin-endpoints:
    # Development-only until server-side authentication and authorization exist.
    enabled: false

  security:
    jwt:
      # JWT signing secret - MUST be set in production via environment variable
      # Generate a secure random key: openssl rand -base64 64
      secret: "${JWT_SECRET:default-dev-secret-key-for-growthprint-backend-min-32-chars}"
      # Token expiration time (default: 1 hour)
      expiration: 1h
      issuer: growthprint-backend

  cors:
    # Allowed CORS origins for frontend (comma-separated)
    # Development: http://localhost:3000
    # Production: https://your-production-domain.com
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"

  rate-limit:
    public-inquiries:
      # Maximum requests per time window
      max-requests: 10
      # Time window for rate limiting
      window: 1m
