
spring:
  application:
    name: growthprint-backend

  datasource:
    url: "${DATABASE_URL:}"
    username: "${DATABASE_USERNAME:}"
    password: "${DATABASE_PASSWORD:}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  # API docs / Swagger UI stay on by default for backwards compatibility.
  # Set SPRINGDOC_ENABLED=false in staging/production (see DEPLOYMENT.md).
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
  openapi:
    info:
      title: GrowthPrint Backend API
      description: REST API for the GrowthPrint platform
      version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: 8090
  # Honour X-Forwarded-* headers only from trusted internal proxies (Tomcat RemoteIpValve
  # defaults: 10/8, 172.16/12, 192.168/16, 127/8, ...). Needed behind Render's load balancer so
  # per-client rate limiting sees the real client IP and HTTPS is detected (HSTS).
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never

app:
  ai:
    # AES-256 key (base64 of 32 random bytes) used to encrypt AI provider API keys in the database.
    # Generate with: openssl rand -base64 32.  Without it, AI keys cannot be saved (the rest of the app works).
    # Keep it outside the database; losing or changing it means re-entering the provider key.
    credentials-encryption-key: "${AI_CREDENTIALS_ENCRYPTION_KEY:}"

  admin-endpoints:
    # Development-only until server-side authentication and authorization exist.
    enabled: false

  company:
    # Seller details printed on invoice PDFs (Decision 15). ALL optional: a block that is not configured
    # is left out of the PDF; nothing (bank, tax or legal details) is ever invented.
    # Multi-line values (address, payment instructions): separate lines with a literal \n.
    name: "${COMPANY_NAME:GrowthPrint}"
    email: "${COMPANY_EMAIL:}"
    website: "${COMPANY_WEBSITE:}"
    address: "${COMPANY_ADDRESS:}"
    phone: "${COMPANY_PHONE:}"
    tax-id: "${COMPANY_TAX_ID:}"
    registration-number: "${COMPANY_REGISTRATION_NUMBER:}"
    payment-instructions: "${COMPANY_PAYMENT_INSTRUCTIONS:}"

  security:
    jwt:
      # JWT signing secret - REQUIRED in every environment via the JWT_SECRET environment variable.
      # There is intentionally no fallback: a publicly known default would let anyone forge ADMIN tokens.
      # The application refuses to start if it is missing or shorter than 32 characters.
      # Generate a secure random key: openssl rand -base64 64
      secret: "${JWT_SECRET:}"
      # Token expiration time (default: 1 hour)
      expiration: 1h
      issuer: growthprint-backend

  cors:
    # Allowed CORS origins for frontend (comma-separated)
    # Development: http://localhost:3000
    # Production: https://your-production-domain.com
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"

  rate-limit:
    public-inquiries:
      # Maximum requests per time window (per client IP)
      max-requests: 10
      # Time window for rate limiting
      window: 1m
    login:
      # Brute-force protection for POST /api/v1/auth/login (per client IP)
      max-requests: 10
      window: 1m
