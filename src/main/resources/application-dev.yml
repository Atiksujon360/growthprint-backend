# Development profile configuration
# This file is committed to source control and contains safe, non-sensitive configuration
# Actual credentials are loaded from .env file (which is git-ignored)

spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  ai:
    # Lets the custom AI endpoint point at a local model server (Ollama, LM Studio). Development only.
    allow-local-endpoints: true

# Swagger UI and API docs stay available for local development (off by default elsewhere, R6).
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    com.growthprint.backend: DEBUG
    org.springframework.security: DEBUG
